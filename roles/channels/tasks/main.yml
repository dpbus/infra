---
- name: Create channels group
  ansible.builtin.group:
    name: "{{ channels_group }}"
    system: true

- name: Create channels user
  ansible.builtin.user:
    name: "{{ channels_user }}"
    group: "{{ channels_group }}"
    groups: "{{ channels_extra_groups }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ channels_install_dir }}"
    create_home: false

- name: Download Channels DVR with the official setup script
  ansible.builtin.shell: curl -fsSL https://getchannels.com/dvr/setup.sh | sh
  args:
    chdir: "{{ channels_install_dir | dirname }}"
    creates: "{{ channels_install_dir }}/latest"
  environment:
    DOWNLOAD_ONLY: "1"

- name: Set ownership of the install directory
  ansible.builtin.file:
    path: "{{ channels_install_dir }}"
    state: directory
    owner: "{{ channels_user }}"
    group: "{{ channels_group }}"
    recurse: true

- name: Install channels-dvr systemd unit
  ansible.builtin.template:
    src: channels-dvr.service.j2
    dest: /etc/systemd/system/channels-dvr.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart channels-dvr

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Enable channels-dvr
  ansible.builtin.systemd_service:
    name: channels-dvr
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"

- name: Install guide and virtual channel refresh units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - channels-refresh.service
    - channels-refresh.timer
  notify: Reload systemd

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Enable refresh timer
  ansible.builtin.systemd_service:
    name: channels-refresh.timer
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"
